
import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
	id 'fabric-loom' version '1.3-SNAPSHOT'
	id 'maven-publish'
    id "org.jetbrains.kotlin.jvm" version "1.9.0"
	id "com.github.johnrengelman.shadow" version "7.1.0"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	mavenCentral()

	maven { url "https://jitpack.io" }

	// For metor-orbit event bus
	maven {
		name = "meteor-maven"
		url = "https://maven.meteordev.org/releases"
	}

	// For a rendering library
	maven {
		name = "Ladysnake Mods"
		url = "https://maven.ladysnake.org/releases"
		content {
			includeGroup "io.github.ladysnake"
			includeGroup "org.ladysnake"
			includeGroupByRegex "dev\\.onyxstudios.*"
		}
	}
}

loom {
	configurations {
		lwjgl
		lwjglNative {
			transitive = false
		}
	}
}

sourceSets.main.runtimeClasspath += configurations.lwjglNative

task lwjglJar(type: ShadowJar) {
	group = "shadow"
	archiveClassifier.set("lwjgl")
	configurations = [project.configurations.lwjgl]
	exclude "META-INF/versions/**"
	exclude "**/module-info.class"
	exclude "**/package-info.class"
	relocate("org.lwjgl", "org.lwjgl3") {
		include "org.lwjgl.PointerBuffer"
		include "org.lwjgl.BufferUtils"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	lwjgl "org.lwjgl:lwjgl:3.3.0"
	lwjgl "org.lwjgl:lwjgl-tinyfd:3.3.0"
	lwjgl "org.lwjgl:lwjgl-nanovg:3.3.0"
	lwjglNative "org.lwjgl:lwjgl:3.3.0:natives-windows"
	lwjglNative "org.lwjgl:lwjgl-tinyfd:3.3.0:natives-windows"
	lwjglNative "org.lwjgl:lwjgl-nanovg:3.3.0:natives-windows"
	implementation lwjglJar.outputs.files

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")
	modImplementation("net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}")
	// Uncomment the following line to enable the deprecated Fabric API modules. 
	// These are included in the Fabric API production distribution and allow you to update your mod to the latest modules at a later more convenient time.

	// modImplementation "net.fabricmc.fabric-api:fabric-api-deprecated:${project.fabric_version}"


	// meteor orbit event bus
	implementation "meteordevelopment:orbit:0.2.3"
	include "meteordevelopment:orbit:0.2.3"

	// Rendering library
	include modImplementation("com.github.0x3C50:Renderer:master-SNAPSHOT")

	implementation("org.lwjgl:lwjgl-nanovg:3.3.1")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
	kotlinOptions {
		jvmTarget = 17
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}