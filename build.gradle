import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
	id 'fabric-loom' version '1.16-SNAPSHOT'
//	id 'maven-publish'
    id "org.jetbrains.kotlin.jvm" version "2.1.21"
	id "com.gradleup.shadow" version "9.2.2"
	id("org.jetbrains.dokka") version "1.9.10"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	mavenCentral()

	maven { url "https://jitpack.io" }

	// For metor-orbit event bus
	maven {
		name = "meteor-maven"
		url = "https://maven.meteordev.org/releases"
	}

//	maven {
//		name = 'Ladysnake Mods'
//		url = 'https://maven.ladysnake.org/releases'
//		content {
//			includeGroup 'io.github.ladysnake'
//			includeGroup 'org.ladysnake'
//			includeGroupByRegex 'dev\\.onyxstudios.*'
//		}
//	}

	exclusiveContent {
		forRepository {
			maven {
				name = "modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup("maven.modrinth")
		}
	}

	maven { url "https://repo.hypixel.net/repository/Hypixel/" }
}

loom {
	configurations {
		lwjgl
		lwjglNative {
			transitive = false
		}
	}
}

sourceSets.main.runtimeClasspath += configurations.lwjglNative

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")
	modImplementation("net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}")

	// MixinExtras
//	include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:0.2.0-rc.4")))
	implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:0.2.0-rc.4"))

	// Hypixel API
	include(implementation("net.hypixel:hypixel-api-transport-apache:4.3"))
	include(implementation("net.hypixel:hypixel-api-core:4.3"))
	include("org.apache.httpcomponents:httpclient:4.5.14")
	include("org.apache.httpcomponents:httpcore:4.4.16")
	include("commons-logging:commons-logging:1.2")

	// meteor orbit event bus
	include(implementation("meteordevelopment:orbit:0.2.3"))


	// For mixin into other mods
	modCompileOnly("maven.modrinth:sodium:${project.sodium_version}") { transitive = false }
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release.set(21)
}

tasks.withType(KotlinCompile).configureEach {
	kotlinOptions {
		jvmTarget = 21
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

